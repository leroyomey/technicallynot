# The form of the "Ideas" category in Discussions.
body:
  - type: textarea
    id: task
    attributes:
      label: What you are trying to do
      description: The task, not the feature.
      placeholder: I run four agents and lose track of which one waits for me.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: What you do today instead

  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true

  - type: dropdown
    id: changes-the-look
    attributes:
      label: Does it change the look or the layout?
      description: >-
        The design is the owner's. An idea that adds a control in an existing place is easier
        to say yes to than one that moves things.
      options:
        - No, it works inside what is there
        - It adds a control in an existing place
        - Yes, it moves or restyles something
        - I am not sure
    validations:
      required: true
